name: Validate and publish materials
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: materials-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          if [ -z "$BASE_SHA" ]; then
            export BASE_SHA="$(git rev-parse HEAD^)"
          fi
          npm run build
        env:
          BASE_SHA: ${{ github.event.before }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  deploy:
    if: >-
      github.ref == 'refs/heads/dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'publish(materials): '))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify deployed manifests and every asset
        run: node scripts/smoke.mjs "$PAGES_URL"
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Activate only after verified release publication
        if: >-
          startsWith(github.event.head_commit.message, 'publish(materials): ')
        run: node scripts/activate-publication.mjs
        env:
          PUBLICATION_MESSAGE: ${{ github.event.head_commit.message }}
      - name: Build activated catalog without changing any release
        if: >-
          startsWith(github.event.head_commit.message, 'publish(materials): ')
        run: npm run build
        env:
          BASE_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: >-
          startsWith(github.event.head_commit.message, 'publish(materials): ')
        with:
          name: github-pages-activated
          path: .site
      - uses: actions/deploy-pages@v4
        if: >-
          startsWith(github.event.head_commit.message, 'publish(materials): ')
        id: activated
        with:
          artifact_name: github-pages-activated
      - name: Verify active catalog and preserved versions
        if: >-
          startsWith(github.event.head_commit.message, 'publish(materials): ')
        run: node scripts/smoke.mjs "$PAGES_URL"
        env:
          PAGES_URL: ${{ steps.activated.outputs.page_url }}
